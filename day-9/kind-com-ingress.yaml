kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-pane
  kubeadmConfigPatches:
  - 
    kind: InitConfiguration
    nodeRegistration:
      KubeletExtraArgs:
        node-labels: "Ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443


