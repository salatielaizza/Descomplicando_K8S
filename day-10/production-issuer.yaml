apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: giropops-senhas 
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster.issuer: "letsencrypt-prod" # Asegúrate que no haya espacios extra al final
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - giropops.salatielaizza.com
    secretName: giropops-salatiel-aizza-tls  
  rules:
  - host: giropops.salatielaizza.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: giropops-senhas
            port:
              number: 5000
