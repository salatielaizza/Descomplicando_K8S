apiVersion: v1
kind: Pod
metadata:
  labels:
    run: giropops 
  name: giropops
spec:
  containers:
  - image: nginx 
    name: webserver
    volumeMounts:
    - mountPath: /giropops
      name: primeiro-emptydir
    - mountPath: /giropops2
      name: segundo-emptydir
    resources: 
      limits:
        cpu: "1"
        memory: "128Mi"
      requests:
        cpu: "0.5"
        memory: "64Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
  - name: primeiro-emptydir
    emptyDir:
      sizeLimit: 256Mi
  - name: segundo-emptydir
    emptyDir:
      sizeLimit: 256Mi
