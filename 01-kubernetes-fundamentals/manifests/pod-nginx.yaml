# Single nginx Pod, originally generated with:
#   kubectl run giropops --image nginx --port 80 --dry-run=client -o yaml
# and then cleaned up (generated noise removed, pinned image, labels, resources).
#
# Usage:
#   kubectl apply -f manifests/pod-nginx.yaml
#   kubectl get pod giropops -o wide
apiVersion: v1
kind: Pod
metadata:
  name: giropops
  labels:
    run: giropops                       # label added by `kubectl run`, kept for compatibility
    app.kubernetes.io/name: giropops    # recommended label, used by the Service selector
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: descomplicando-k8s
spec:
  containers:
    - name: nginx
      image: nginx:1.30                 # pinned stable branch instead of the moving `latest` tag
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      resources:
        requests:                       # what the scheduler reserves on a node
          cpu: 50m
          memory: 64Mi
        limits:                         # hard cap enforced by the kubelet/runtime
          cpu: 250m
          memory: 128Mi
  restartPolicy: Always
