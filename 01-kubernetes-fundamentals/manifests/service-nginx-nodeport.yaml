# NodePort Service that exposes the `giropops` Pod outside the cluster.
# Works together with kind/kind-multinode.yaml, which maps host port 8080
# to node port 30080.
#
# Usage:
#   kubectl apply -f manifests/service-nginx-nodeport.yaml
#   curl -I http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: giropops
  labels:
    app.kubernetes.io/name: giropops
    app.kubernetes.io/part-of: descomplicando-k8s
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: giropops
  ports:
    - name: http
      port: 80            # Service (ClusterIP) port inside the cluster
      targetPort: http    # named container port on the Pod
      nodePort: 30080     # must match containerPort in kind/kind-multinode.yaml
      protocol: TCP
